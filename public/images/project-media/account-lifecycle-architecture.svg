<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Account Lifecycle Platform architecture</title><desc id="desc">React frontend to FastAPI backend to PostgreSQL and a separate local Playwright automation agent.</desc>
  <rect width="1400" height="760" fill="#111116"/><g font-family="Arial, sans-serif" fill="#f2f1ed"><text x="72" y="82" font-size="18" fill="#9f8bff" letter-spacing="3">ARCHITECTURE / ACCOUNT LIFECYCLE</text><text x="72" y="138" font-size="42" font-weight="700">Control plane / execution plane</text><text x="72" y="178" font-size="20" fill="#aaa8b2">Browser state stays local; durable workflow state stays observable.</text>
  <g transform="translate(90 270)"><rect width="260" height="170" rx="16" fill="#1c1c23" stroke="#6553b8"/><text x="28" y="52" font-size="16" fill="#aaa8b2">WEB APP</text><text x="28" y="94" font-size="30" font-weight="700">React / Vite</text><text x="28" y="130" font-size="16" fill="#aaa8b2">pages · hooks · API client</text></g>
  <g transform="translate(450 270)"><rect width="260" height="170" rx="16" fill="#1c1c23" stroke="#6553b8"/><text x="28" y="52" font-size="16" fill="#aaa8b2">CONTROL PLANE</text><text x="28" y="94" font-size="30" font-weight="700">FastAPI</text><text x="28" y="130" font-size="16" fill="#aaa8b2">routers · services · jobs</text></g>
  <g transform="translate(810 270)"><rect width="260" height="170" rx="16" fill="#1c1c23" stroke="#6553b8"/><text x="28" y="52" font-size="16" fill="#aaa8b2">PERSISTENCE</text><text x="28" y="94" font-size="30" font-weight="700">PostgreSQL</text><text x="28" y="130" font-size="16" fill="#aaa8b2">async SQLAlchemy · Alembic</text></g>
  <g transform="translate(450 540)"><rect width="620" height="116" rx="16" fill="#251f3b" stroke="#a18cff"/><text x="28" y="48" font-size="16" fill="#c7baff">EXECUTION PLANE</text><text x="28" y="84" font-size="25" font-weight="700">Local Automation Agent · Playwright · persistent profiles</text></g>
  <g stroke="#8c7ae8" stroke-width="3" fill="none"><path d="M350 355h100"/><path d="M710 355h100"/><path d="M580 440v98"/></g><g fill="#8c7ae8"><path d="m438 345 18 10-18 10z"/><path d="m798 345 18 10-18 10z"/><path d="m570 528 10 18 10-18z"/></g><text x="90" y="700" font-size="17" fill="#aaa8b2">Queued jobs, scheduler records, workflow states, and activity history make browser work inspectable.</text></g>
</svg>
