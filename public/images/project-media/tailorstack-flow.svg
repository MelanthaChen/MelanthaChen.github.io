<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">TailorStack evidence and versioning flow</title><desc id="desc">Structured resume data flows through deterministic matching and reviewable AI patches into immutable versions and generated artifacts.</desc>
  <rect width="1400" height="760" fill="#111116"/><g font-family="Arial, sans-serif" fill="#f2f1ed"><text x="72" y="82" font-size="18" fill="#9f8bff" letter-spacing="3">IMPLEMENTED FLOW / TAILORSTACK</text><text x="72" y="138" font-size="42" font-weight="700">Suggestion is not committed state</text><text x="72" y="178" font-size="20" fill="#aaa8b2">Deterministic matching · evidence-backed gaps · reviewable patch sets</text>
  <g transform="translate(72 285)"><rect width="250" height="150" rx="14" fill="#1c1c23" stroke="#6553b8"/><text x="24" y="50" font-size="16" fill="#aaa8b2">SOURCE OF TRUTH</text><text x="24" y="94" font-size="28" font-weight="700">Canonical resume</text><text x="24" y="124" font-size="15" fill="#aaa8b2">structured sections</text></g>
  <g transform="translate(382 285)"><rect width="250" height="150" rx="14" fill="#1c1c23" stroke="#6553b8"/><text x="24" y="50" font-size="16" fill="#aaa8b2">DETERMINISTIC</text><text x="24" y="94" font-size="28" font-weight="700">Matcher</text><text x="24" y="124" font-size="15" fill="#aaa8b2">evidence + gaps</text></g>
  <g transform="translate(692 285)"><rect width="250" height="150" rx="14" fill="#251f3b" stroke="#a18cff"/><text x="24" y="50" font-size="16" fill="#c7baff">REVIEWABLE AI</text><text x="24" y="94" font-size="28" font-weight="700">Patch set</text><text x="24" y="124" font-size="15" fill="#aaa8b2">proposed wording</text></g>
  <g transform="translate(1002 285)"><rect width="250" height="150" rx="14" fill="#1c1c23" stroke="#6553b8"/><text x="24" y="50" font-size="16" fill="#aaa8b2">IMMUTABLE</text><text x="24" y="94" font-size="28" font-weight="700">Version + artifacts</text><text x="24" y="124" font-size="15" fill="#aaa8b2">PDF · HTML · JSON</text></g>
  <g stroke="#8c7ae8" stroke-width="3" fill="none"><path d="M322 360h60"/><path d="M632 360h60"/><path d="M942 360h60"/></g><g fill="#8c7ae8"><path d="m372 350 18 10-18 10z"/><path d="m682 350 18 10-18 10z"/><path d="m992 350 18 10-18 10z"/></g><text x="72" y="560" font-size="20" fill="#f2f1ed">AI can parse, explain, and propose. Deterministic services own matching, validation, and application.</text><text x="72" y="604" font-size="17" fill="#aaa8b2">Node.js monorepo · PostgreSQL · async job layer · migrations · unit/integration/end-to-end test areas</text></g>
</svg>
