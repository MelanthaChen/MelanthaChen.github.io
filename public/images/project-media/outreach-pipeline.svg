<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">GEO Research Outreach Agent pipeline</title><desc id="desc">A verified pipeline from candidate domains through identity verification, qualification, contact evidence and human review.</desc>
