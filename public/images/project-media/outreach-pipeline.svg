  <g transform="translate(1026 250)"><rect width="230" height="160" rx="14" fill="#1c1c23" stroke="#d1bfff"/><text x="24" y="48" font-size="16" fill="#aaa8b2">HUMAN REVIEW</text><text x="24" y="92" font-size="34" font-weight="700">PENDING</text><text x="24" y="124" font-size="16" fill="#aaa8b2">no outreach sent</text></g>
