<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">AlgoCoach browser integration</title><desc id="desc">A Manifest V3 content script mounts a React panel in Shadow DOM and responds to LeetCode SPA routes with local metadata.</desc>
  <rect width="1400" height="760" fill="#111116"/><g font-family="Arial, sans-serif" fill="#f2f1ed"><text x="72" y="82" font-size="18" fill="#9f8bff" letter-spacing="3">BROWSER INTEGRATION / ALGOCOACH</text><text x="72" y="138" font-size="42" font-weight="700">A useful layer that respects its host</text><text x="72" y="178" font-size="20" fill="#aaa8b2">Manifest V3 · React/TypeScript · Shadow DOM · local-first metadata</text>
  <g transform="translate(90 260)"><rect width="370" height="250" rx="16" fill="#1c1c23" stroke="#6553b8"/><text x="28" y="50" font-size="16" fill="#aaa8b2">LEETCODE SPA</text><rect x="28" y="80" width="314" height="38" rx="6" fill="#0f0f13"/><text x="44" y="105" font-size="15" fill="#aaa8b2">/problems/binary-search</text><rect x="28" y="140" width="170" height="86" rx="8" fill="#292730"/><text x="44" y="175" font-size="18" font-weight="700">Problem page</text><text x="44" y="202" font-size="14" fill="#aaa8b2">host UI remains intact</text></g>
  <g transform="translate(515 260)"><rect width="300" height="250" rx="16" fill="#251f3b" stroke="#a18cff"/><text x="28" y="50" font-size="16" fill="#c7baff">CONTENT SCRIPT</text><text x="28" y="100" font-size="26" font-weight="700">Route detector</text><text x="28" y="142" font-size="16" fill="#aaa8b2">mount / remount on SPA history</text><text x="28" y="185" font-size="16" fill="#aaa8b2">inject isolated styles</text></g>
  <g transform="translate(870 260)"><rect width="370" height="250" rx="16" fill="#1c1c23" stroke="#6553b8"/><text x="28" y="50" font-size="16" fill="#aaa8b2">SHADOW DOM PANEL</text><text x="28" y="100" font-size="26" font-weight="700">AlgoCoach</text><text x="28" y="142" font-size="16" fill="#aaa8b2">visualize · notes · progress</text><text x="28" y="185" font-size="16" fill="#aaa8b2">local metadata + storage</text></g>
  <g stroke="#8c7ae8" stroke-width="3" fill="none"><path d="M460 385h55"/><path d="M815 385h55"/></g><g fill="#8c7ae8"><path d="m505 375 18 10-18 10z"/><path d="m860 375 18 10-18 10z"/></g><text x="90" y="620" font-size="20" fill="#f2f1ed">The integration boundary is the feature: no backend required, no host-page CSS leakage.</text></g>
</svg>
