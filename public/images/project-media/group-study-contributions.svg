  <rect width="1400" height="760" fill="#111116"/><g font-family="Arial, sans-serif" fill="#f2f1ed"><text x="72" y="82" font-size="18" fill="#9f8bff" letter-spacing="3">TEAM PROJECT / JAVA 17 + JAVAFX</text><text x="72" y="138" font-size="42" font-weight="700">Make ownership visible</text><text x="72" y="178" font-size="20" fill="#aaa8b2">Three-person application · custom ADTs · study-room state</text>
  <g transform="translate(80 265)"><rect width="330" height="250" rx="16" fill="#251f3b" stroke="#a18cff"/><text x="28" y="52" font-size="16" fill="#c7baff">YUXUAN CHEN</text><text x="28" y="100" font-size="25" font-weight="700">Documented work</text><text x="28" y="146" font-size="16" fill="#aaa8b2">time tracking</text><text x="28" y="178" font-size="16" fill="#aaa8b2">Hashing ADT + HashMap</text><text x="28" y="210" font-size="16" fill="#aaa8b2">room/user status · search · creation</text></g>
  <g transform="translate(530 265)"><rect width="330" height="250" rx="16" fill="#1c1c23" stroke="#6553b8"/><text x="28" y="52" font-size="16" fill="#aaa8b2">SHARED APPLICATION</text><text x="28" y="100" font-size="25" font-weight="700">Study room state</text><text x="28" y="146" font-size="16" fill="#aaa8b2">public/private rooms</text><text x="28" y="178" font-size="16" fill="#aaa8b2">active · ended · break</text><text x="28" y="210" font-size="16" fill="#aaa8b2">JavaFX + Maven</text></g>
  <g transform="translate(980 265)"><rect width="330" height="250" rx="16" fill="#1c1c23" stroke="#6553b8"/><text x="28" y="52" font-size="16" fill="#aaa8b2">TEAMMATE-OWNED</text><text x="28" y="100" font-size="25" font-weight="700">Other systems</text><text x="28" y="146" font-size="16" fill="#aaa8b2">Pokémon evolution</text><text x="28" y="178" font-size="16" fill="#aaa8b2">trophies · leaderboards</text><text x="28" y="210" font-size="16" fill="#aaa8b2">attributed to teammates</text></g>
  <g stroke="#8c7ae8" stroke-width="3" fill="none"><path d="M410 390h120"/><path d="M860 390h120"/></g><g fill="#8c7ae8"><path d="m520 380 18 10-18 10z"/><path d="m970 380 18 10-18 10z"/></g><text x="80" y="630" font-size="20" fill="#f2f1ed">A team project is stronger when individual contribution is precise.</text></g>
